<style>

*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 12px}button:hover{background:var(--soft)}button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--ink);outline-offset:3px}a{color:var(--ink)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(23px,2.2vw,32px);letter-spacing:.02em;margin-bottom:10px}h2{font-size:21px}h3{font-size:17px}p{line-height:1.8}.shell{max-width:1900px;margin:auto;padding:28px 32px 40px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--ink);margin-bottom:10px}.subtitle{font-size:14px;color:var(--sub);margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.downloads{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.downloads a{text-decoration:none;white-space:nowrap;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}.tools{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.tabs{display:flex;gap:5px}.tabs button{border-color:transparent;background:transparent;padding:10px 16px}.tabs button[aria-selected=true]{background:var(--ink)}.search{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:240px}.search input{color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 12px;width:min(100%,360px)}.search span{font-size:12px;color:var(--sub);white-space:nowrap}.intro{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.8}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:15px}.badge{display:inline-block;font-size:11px;line-height:1.6;border-radius:4px;padding:2px 6px;background:var(--soft);color:var(--ink);white-space:nowrap}.badge[data-kind="warn"]{background:var(--warn);color:var(--amber)}.badge[data-kind="ok"]{background:var(--greenbg);color:var(--green)}.legend .badge{font-size:12px}.legend small{font-size:12px;color:var(--sub)}.map-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.map-controls button,.map-controls select{font-size:13px}.map-controls select{min-width:200px;max-width:100%;padding:8px 10px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px}.map-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}.viewport{position:relative;min-width:0;height:650px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#map.dragging{cursor:grabbing}.edge{fill:none;stroke:var(--line);stroke-width:1.5}.node rect{fill:var(--node);stroke:var(--line);stroke-width:1}.node text{fill:var(--fg);font-size:14px;pointer-events:none}.node .meta{fill:var(--sub);font-size:11px}.node .toggle{fill:var(--ink);font-size:17px}.node.module rect{fill:var(--soft);stroke:var(--line)}.node.root rect{fill:var(--ink);stroke:var(--ink)}.node.root text{fill:var(--surface)}.node.root .meta{fill:var(--surface)}.node.selected rect{stroke:var(--ink);stroke-width:2.5}.node.matched rect{fill:var(--warn);stroke:var(--amber);stroke-width:2}.node:hover rect{stroke:var(--ink)}.hint{position:absolute;bottom:10px;left:12px;font-size:12px;color:var(--sub);padding:4px 7px;background:var(--surface);pointer-events:none}.zoom-info{position:absolute;top:12px;right:14px;color:var(--sub);font-size:12px}.notes{background:var(--surface);padding:22px;border:1px solid var(--line);border-radius:10px;min-width:0}.notes h2{font-size:19px;line-height:1.5;margin:9px 0 14px}.notes p{font-size:14px;margin:10px 0}.notes .path{font-size:12px;color:var(--sub);line-height:1.7;overflow-wrap:anywhere}.notes ul{font-size:13px;line-height:1.8;padding-left:18px;margin:8px 0 0}.notes h3{font-size:13px;color:var(--sub);margin:18px 0 5px}.notes code{overflow-wrap:anywhere;font-size:12px}.source{overflow-wrap:anywhere}.results{margin:6px 0 16px;display:flex;gap:6px;flex-wrap:wrap}.results button{font-size:12px;padding:6px 9px}.report{max-width:1220px;margin:auto}.section{margin:15px 0}.section>summary{font-size:18px;padding:16px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;line-height:1.8}.feature{padding:10px 0 10px 16px;border-left:1px solid var(--line);margin-left:6px}.feature>summary{font-size:14px}.feature p{font-size:14px;margin:9px 0}.report .evidence{font-size:12px;color:var(--sub);overflow-wrap:anywhere;line-height:1.8}.api-tools{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}.api-tools select{font-size:14px;padding:8px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface)}th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--sub);font-size:12px;font-weight:500}td code{font-size:12px}td:last-child{max-width:430px;font-size:12px;color:var(--sub)}tr:hover td{background:var(--soft)}[hidden]{display:none!important}.footer{font-size:12px;color:var(--sub);margin:23px 0 0;line-height:1.9}.empty{padding:30px;color:var(--sub)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

<script id="data" type="application/json">__MAP_DATA__</script>
<script id="inventory" type="application/json">__INVENTORY__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent), INV=JSON.parse(document.getElementById('inventory').textContent);
const root=DATA.root, nodes=new Map(), parent=new Map(), depth=new Map();
function index(n,p=null,d=0){nodes.set(n.id,n);parent.set(n.id,p);depth.set(n.id,d);n.children.forEach(c=>index(c,n,d+1))}index(root);
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg', svg=$('map'), stage=$('stage');
const open=new Set([root.id]);let selected=root.id, focused='', query='', mode='map', positions=[], links=[], scale=1,tx=0,ty=0;
const W=252,H=64,DX=322,GAP=11;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kind=s=>['部分实现','前端保留'].includes(s)?'warn':s==='主入口'?'ok':'normal';
const badge=s=>'<span class="badge" data-kind="'+kind(s)+'">'+esc(s)+'</span>';
const sourceHTML=e=>esc(e.repository)+' · <a class="source" href="'+esc('file:///'+e.path.replaceAll('\\','/'))+'">'+esc(e.file)+':'+e.line+'</a>';
const pathOf=n=>{const p=[];while(n){p.unshift(n.title);n=parent.get(n.id)}return p};
const match=n=>!query||[n.title,n.description,n.status,...n.apis].join(' ').toLowerCase().includes(query);
$('stats').textContent=DATA.asOf+' 源码快照 · '+DATA.stats.functionalModules+' 个功能模块 · '+DATA.stats.featureLeaves+' 项功能说明 · '+DATA.stats.backendEndpoints+' 个后端方法映射';
$('footer').textContent='代码范围：前端 '+DATA.repositories.frontend+'；后端 '+DATA.repositories.backend+'。覆盖 '+DATA.stats.mappedControllers+' 个有效映射控制器、'+DATA.stats.apiFiles+' 个API文件、'+DATA.stats.wrapperDeclarations+' 个API导出声明。接口数量按有效方法及路径计，声明数不等于独立功能数。';
root.children.forEach(n=>{const opt=document.createElement('option');opt.value=n.id;opt.textContent=n.title;$('module').append(opt)});
function showNotes(id){const n=nodes.get(id);selected=id;$('notes').innerHTML='<div class="path">'+esc(pathOf(n).slice(1,-1).join(' / ')||'平台功能总览')+'</div><h2>'+esc(n.title)+'</h2>'+badge(n.status)+'<p>'+esc(n.description)+'</p>'+(n.children.length?'<p class="path">下级节点 '+n.children.length+' 项</p>':'')+(n.apis.length?'<h3>关联接口</h3><ul>'+n.apis.map(a=>'<li><code>'+esc(a)+'</code></li>').join('')+'</ul>':'')+'<h3>源码依据</h3><ul>'+n.evidence.map(e=>'<li>'+sourceHTML(e)+'</li>').join('')+'</ul>';}
function children(n){return open.has(n.id)?n.children:[]}
function measure(n){const cc=children(n);return cc.length?Math.max(H,cc.reduce((sum,c)=>sum+measure(c),0)+(cc.length-1)*GAP):H}
function layout(n,x,y,side){positions.push({n,x,y});const cc=children(n);if(!cc.length)return;let top=y-(cc.reduce((sum,c)=>sum+measure(c),0)+(cc.length-1)*GAP)/2;cc.forEach(c=>{const size=measure(c),cy=top+size/2,cx=x+DX*side;links.push({from:{x,y},to:{x:cx,y:cy},side});layout(c,cx,cy,side);top+=size+GAP})}
function elem(name,attrs){const el=document.createElementNS(NS,name);Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,String(v)));return el}
const cv=document.createElement('canvas'), ctx=cv.getContext('2d');ctx.font='14px "Microsoft YaHei",sans-serif';
function wrap(text,max=215){const rows=[];let row='';for(const c of text){if(ctx.measureText(row+c).width>max&&row){rows.push(row);row=c}else row+=c}if(row)rows.push(row);return rows}
function compactNode(n){if(query&&!hasMatch(n))return '';return '<details class="compact-topic" data-nid="'+n.id+'"'+(open.has(n.id)||query?' open':'')+'><summary>'+esc(n.title)+' '+badge(n.status)+'</summary><p>'+esc(n.description)+'</p>'+(n.apis.length?'<p><code>'+n.apis.map(esc).join('<br>')+'</code></p>':'')+n.children.map(compactNode).join('')+'</details>'}
function renderCompact(){const list=focused?[nodes.get(focused)]:root.children;$('compact-tree').innerHTML='<div class="compact-root">手机监测平台 · '+DATA.stats.featureLeaves+' 项功能说明</div>'+list.map(compactNode).join('');$('compact-tree').querySelectorAll('details').forEach(d=>d.addEventListener('toggle',e=>{if(e.target!==d)return;d.open?open.add(d.dataset.nid):open.delete(d.dataset.nid)}))}
function redraw(fit=false){positions=[];links=[];stage.replaceChildren();if(focused){const n=nodes.get(focused);layout(n,0,0,1)}else{positions.push({n:root,x:0,y:0});const split=Math.ceil(root.children.length/2);[[-1,root.children.slice(0,split)],[1,root.children.slice(split)]].forEach(([side,cc])=>{let top=-(cc.reduce((s,c)=>s+measure(c),0)+(cc.length-1)*GAP)/2;cc.forEach(c=>{const h=measure(c),y=top+h/2;links.push({from:{x:0,y:0},to:{x:DX*side,y},side});layout(c,DX*side,y,side);top+=h+GAP})})}
 links.forEach(l=>{const x1=l.from.x+l.side*W/2,x2=l.to.x-l.side*W/2,mid=(x1+x2)/2;stage.append(elem('path',{class:'edge',d:`M ${x1} ${l.from.y} C ${mid} ${l.from.y}, ${mid} ${l.to.y}, ${x2} ${l.to.y}`}))});
 positions.forEach(({n,x,y})=>{const g=elem('g',{class:'node '+(n.id===root.id?'root ':depth.get(n.id)===1?'module ':'')+(selected===n.id?'selected ':'')+(query&&match(n)?'matched':''),transform:`translate(${x},${y})`,role:'button',tabindex:'0','aria-label':n.title+'，'+n.status+(n.children.length?'，'+(open.has(n.id)?'已展开':'已收起'):''),'data-id':n.id});if(n.children.length)g.setAttribute('aria-expanded',String(open.has(n.id)));
 const title=elem('title');title.textContent=n.title+'\n'+n.description;g.append(title,elem('rect',{x:-W/2,y:-H/2,width:W,height:H,rx:8}));
 const rows=wrap(n.title,n.children.length?211:226);const visible=rows.slice(0,2);if(rows.length>2)visible[1]=visible[1].slice(0,-1)+'…';visible.forEach((r,i)=>{const t=elem('text',{x:-W/2+14,y:rows.length===1?-5:-11+i*17});t.textContent=r;g.append(t)});
 const meta=elem('text',{class:'meta',x:-W/2+14,y:23});meta.textContent=n.status+(n.children.length?' · '+n.children.length+'项':'');g.append(meta);
 if(n.children.length){const t=elem('text',{class:'toggle',x:W/2-21,y:4});t.textContent=open.has(n.id)?'−':'+';g.append(t)}
 const activate=()=>{showNotes(n.id);if(n.id===root.id){open.clear();open.add(root.id);redraw(true);return}if(n.children.length){open.has(n.id)?open.delete(n.id):open.add(n.id)}redraw();center(n.id)};g.addEventListener('click',activate);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}});stage.append(g)});
 renderCompact();if(fit)fitAll();else transform();}
function transform(){stage.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);$('zoom-info').textContent=Math.round(scale*100)+'% · '+positions.length+' 个可见节点'}
function fitAll(){const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;const minX=Math.min(...positions.map(p=>p.x-W/2))-30,maxX=Math.max(...positions.map(p=>p.x+W/2))+30,minY=Math.min(...positions.map(p=>p.y-H/2))-30,maxY=Math.max(...positions.map(p=>p.y+H/2))+30;scale=Math.min(1.1,(r.width-20)/(maxX-minX),(r.height-40)/(maxY-minY));scale=Math.max(.03,scale);tx=r.width/2-(minX+maxX)/2*scale;ty=r.height/2-(minY+maxY)/2*scale;transform()}
function center(id){const p=positions.find(p=>p.n.id===id);if(!p)return;const r=svg.getBoundingClientRect();tx=r.width/2-p.x*scale;ty=r.height/2-p.y*scale;transform()}
function zoom(factor,cx,cy){const r=svg.getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;const next=Math.max(.03,Math.min(2.4,scale*factor));tx=cx-(cx-tx)*next/scale;ty=cy-(cy-ty)*next/scale;scale=next;transform()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0014),e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null;svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')});svg.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform()});const stop=()=>{drag=null;svg.classList.remove('dragging')};svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
$('zoom-in').onclick=()=>zoom(1.2);$('zoom-out').onclick=()=>zoom(1/1.2);$('fit').onclick=fitAll;
$('collapse').onclick=()=>{open.clear();open.add(root.id);focused='';$('module').value='';showNotes(root.id);redraw(true)};
$('expand').onclick=()=>{const visible=[...positions];visible.forEach(p=>{if(p.n.children.length)open.add(p.n.id)});redraw();const maxLeaves=positions.length;if(maxLeaves<40)fitAll();else center(selected)};
$('module').onchange=e=>{focused=e.target.value;if(focused){open.add(focused);showNotes(focused)}else showNotes(root.id);redraw(true)};
function switchView(view){mode=view;['map','report','api'].forEach(v=>{$(v+'-panel').hidden=v!==view;$('tab-'+v).setAttribute('aria-selected',String(v===view))});if(view==='map')redraw(true);if(view==='report')renderReport();if(view==='api')renderAPI();renderResults()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
function navigateNode(n){let current=n;while(current){const p=parent.get(current.id);if(p)open.add(p.id);current=p}focused='';$('module').value='';showNotes(n.id);if(mode!=='map')switchView('map');else redraw();scale=Math.max(.72,Math.min(1,scale));center(n.id)}
function renderResults(){const result=$('results');result.replaceChildren();const matches=[...nodes.values()].filter(n=>n.id!==root.id&&match(n));$('search-count').textContent=query?(mode==='api'?'':'匹配 '+matches.length+' 项'):'';result.hidden=!query||mode!=='map';if(result.hidden)return;matches.slice(0,12).forEach(n=>{const btn=document.createElement('button');btn.type='button';btn.textContent=n.title;btn.onclick=()=>navigateNode(n);result.append(btn)});if(matches.length>12){const span=document.createElement('span');span.className='intro';span.textContent='仅列前12项；切换完整说明可检索全部匹配。';result.append(span)}if(!matches.length)result.textContent='没有匹配的功能节点'}
$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();renderResults();if(mode==='map')redraw();if(mode==='report')renderReport();if(mode==='api')renderAPI()};
function hasMatch(n){return match(n)||n.children.some(hasMatch)}
function reportNode(n,level=0){if(query&&!hasMatch(n))return '';const cls=level===0?'section':'feature', opened=query||level===0;return '<details class="'+cls+'"'+(opened?' open':'')+'><summary>'+esc(n.title)+' '+badge(n.status)+'</summary><p>'+esc(n.description)+'</p>'+(n.apis.length?'<p><code>'+n.apis.map(esc).join('<br>')+'</code></p>':'')+'<div class="evidence">源码依据：'+n.evidence.map(sourceHTML).join('<br>')+'</div>'+n.children.map(c=>reportNode(c,level+1)).join('')+'</details>'}
function renderReport(){$('report-content').innerHTML=root.children.map(n=>reportNode(n)).join('')||'<p class="empty">没有匹配内容</p>'}
$('report-open').onclick=()=>document.querySelectorAll('#report-content details').forEach(d=>d.open=true);$('report-close').onclick=()=>document.querySelectorAll('#report-content details').forEach(d=>d.open=false);$('print').onclick=()=>{document.querySelectorAll('#report-content details').forEach(d=>d.open=true);window.print()};
function renderAPI(){const k=$('api-kind').value;let columns,rows,note;if(k==='backend'){columns=['HTTP方法','接口路径','功能处理','控制器与源码'];rows=INV.backend.map(r=>[r.method,r.path,r.handler,r.controller+' · '+r.file+':'+r.line]);note='排除注释映射；数组路径分别计数。/logout由Spring Security处理，/profile由资源映射处理，不计入此表。类级路径但无方法的AccountFolderReader也不计入。'}else if(k==='wrappers'){columns=['API文件','导出名称','请求方法 / 路径','源码位置'];rows=INV.wrappers.map(r=>[r.file,r.function,r.methods.toUpperCase()+' '+r.paths,r.file+':'+r.line]);note='221个导出声明包含220个命名函数和getRouters箭头函数；保留重复路径及未使用兼容代码。后缀“…”表示拼接动态参数，default表示使用默认或动态方法。存在封装不等于当前后端实现。'}else if(k==='direct'){columns=['路径前缀','引用文件','行号'];rows=INV.direct.map(r=>[r.pathPrefix,r.file,String(r.line)]);note='扫描前端TS/TSX中的字面量url、useApi和base路径引用；动态拼接、条件路径及API封装以源码和其他索引为准，不将此表冒称全量运行时请求。'}else{columns=['代码库','文件','绝对位置'];const unique=new Map();nodes.forEach(n=>n.evidence.forEach(e=>unique.set(e.repository+e.file,e)));rows=[...unique.values()].map(e=>[e.repository,e.file,e.path]);note='功能说明引用文件均已检查存在；source-evidence.json另附SHA256，便于比对后续代码变化。'}
 const filtered=rows.filter(r=>!query||r.join(' ').toLowerCase().includes(query));$('api-head').innerHTML='<tr>'+columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';$('api-body').innerHTML=filtered.map(r=>'<tr>'+r.map((c,i)=>'<td>'+(k==='backend'&&i===1?'<code>'+esc(c)+'</code>':esc(c))+'</td>').join('')+'</tr>').join('');$('api-count').textContent='显示 '+filtered.length+' / '+rows.length+' 项';$('api-note').textContent=note;}
$('api-kind').onchange=renderAPI;
$('export').onclick=()=>{const clone=svg.cloneNode(true);clone.setAttribute('xmlns',NS);const r=svg.getBoundingClientRect();clone.setAttribute('width',String(r.width));clone.setAttribute('height',String(r.height));const styles=getComputedStyle(document.documentElement);const css=`text{font-family:'Microsoft YaHei',sans-serif;font-size:14px;fill:${styles.getPropertyValue('--fg')}}.meta{font-size:11px;fill:${styles.getPropertyValue('--sub')}}.toggle{font-size:17px;fill:${styles.getPropertyValue('--ink')}}.edge{fill:none;stroke:${styles.getPropertyValue('--line')};stroke-width:1.5}.node rect{fill:${styles.getPropertyValue('--surface')};stroke:${styles.getPropertyValue('--line')};stroke-width:1}.module rect{fill:${styles.getPropertyValue('--soft')}}.root rect{fill:${styles.getPropertyValue('--ink')}}.root text{fill:${styles.getPropertyValue('--surface')}}.selected rect{stroke:${styles.getPropertyValue('--ink')};stroke-width:2.5}`;const style=elem('style');style.textContent=css;clone.prepend(style);const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='手机监测平台-当前功能导图.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
new ResizeObserver(()=>{if(mode==='map')fitAll()}).observe(svg);
showNotes(root.id);redraw(true);renderReport();renderAPI();
</script>
</body>
</html>
