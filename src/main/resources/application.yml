server:
  port: ${SERVER_PORT:8099}
spring:
  application:
    name: phone
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://localhost:3306/phone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}"
    username: "${MYSQL_USERNAME:root}"
    password: "${MYSQL_PASSWORD:Danteng2020!@#}"
    hikari:
      maximum-pool-size: 10
  redis:
    host: "${REDIS_HOST:localhost}"
    port: ${REDIS_PORT:6379}
    password: "${REDIS_PASSWORD:Danteng2020!@#}"
    database: ${REDIS_DATABASE:0}
    timeout: 5s
  jackson:
    time-zone: Asia/Shanghai
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  sql:
    init:
      mode: never
phone:
  name: Phone
  version: 1.0.0
  copyrightYear: 2026
  demoEnabled: false
  profile: "${DOUYIN_OUTPUT:F:/douyin_output}"
  addressEnabled: false
  captchaType: math
  register-enabled: false
  scheduler-enabled: ${DOUYIN_SCHEDULER_ENABLED:true}
  scheduler-device-id: "${DOUYIN_SCHEDULER_DEVICE_ID:}"
  maintenance-enabled: ${DOUYIN_MAINTENANCE_ENABLED:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:5555}
  # D3 采集端虚拟机模板：任务只在模拟器实例上执行，不再连接真机 ADB。
  # Serial/ADB 端口优先从一键部署回执读取，下面的值仅作为回执缺失时的兜底。
  emulator:
    enabled: ${DOUYIN_EMULATOR_ENABLED:true}
    instance-name: "${D3_INSTANCE_NAME:collector-new}"
    serial: "${D3_DEVICE_SERIAL:emulator-5668}"
    adb-server-port: ${D3_ADB_SERVER_PORT:5068}
    appium-url: "${D3_APPIUM_URL:http://127.0.0.1:4725/wd/hub}"
    lab-root: "${D3_LAB_ROOT:F:/D3SereinLab}"
    start-script: "${D3_START_SCRIPT:run-d3.ps1}"
    auto-start: ${D3_EMULATOR_AUTO_START:false}
token:
  header: Authorization
  secret: "${TOKEN_SECRET:replace-with-a-long-random-secret}"
  expireTime: 30
mybatis:
  type-aliases-package: com.phone.module.domain,com.phone.common.core.domain.entity,com.phone.system.domain
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql
xss:
  enabled: true
  excludes: ""
  urlPatterns: /system/*,/module/*
logging:
  level:
    com.phone: info
