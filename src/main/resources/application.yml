server:
  port: ${SERVER_PORT:8099}
spring:
  application:
    name: phone
  datasource:
    url: "jdbc:mysql://localhost:3306/phone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: "phone"
    password: "Danteng2020!@#"
    hikari:
      maximum-pool-size: 10
  redis:
    host: "localhost"
    port: 6379
    password: "Danteng2020!@#"
    database: ${REDIS_DATABASE:0}
    timeout: 5s
  jackson:
    time-zone: Asia/Shanghai
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  sql:
    init:
      mode: never
phone:
  name: Phone
  version: 1.0.0
  copyrightYear: 2026
  demoEnabled: false
  profile: "D:/douyin_output"
  addressEnabled: false
  captchaType: math
  register-enabled: false
  scheduler-enabled: ${DOUYIN_SCHEDULER_ENABLED:false}
  maintenance-enabled: ${DOUYIN_MAINTENANCE_ENABLED:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
token:
  header: Authorization
  secret: "replace-with-a-long-random-secret"
  expireTime: 30
mybatis:
  type-aliases-package: com.phone.module.domain,com.phone.common.core.domain.entity,com.phone.system.domain
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql
xss:
  enabled: true
  excludes: ""
  urlPatterns: /system/*,/module/*
logging:
  level:
    com.phone: info
